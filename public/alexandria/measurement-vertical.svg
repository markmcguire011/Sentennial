<svg width="10" height="1000" xmlns="http://www.w3.org/2000/svg">
  <line x1="5" y1="0" x2="5" y2="1000" stroke="#1E3A8A" stroke-width="0.5" />
  
  <!-- Measurement marks every 50px -->
  <g stroke="#1E3A8A" stroke-width="0.5">
    <line x1="0" y1="0" x2="10" y2="0" />
    <line x1="0" y1="50" x2="10" y2="50" />
    <line x1="0" y1="100" x2="10" y2="100" />
    <line x1="0" y1="150" x2="10" y2="150" />
    <line x1="0" y1="200" x2="10" y2="200" />
    <line x1="0" y1="250" x2="10" y2="250" />
    <line x1="0" y1="300" x2="10" y2="300" />
    <line x1="0" y1="350" x2="10" y2="350" />
    <line x1="0" y1="400" x2="10" y2="400" />
    <line x1="0" y1="450" x2="10" y2="450" />
    <line x1="0" y1="500" x2="10" y2="500" />
    <line x1="0" y1="550" x2="10" y2="550" />
    <line x1="0" y1="600" x2="10" y2="600" />
    <line x1="0" y1="650" x2="10" y2="650" />
    <line x1="0" y1="700" x2="10" y2="700" />
    <line x1="0" y1="750" x2="10" y2="750" />
    <line x1="0" y1="800" x2="10" y2="800" />
    <line x1="0" y1="850" x2="10" y2="850" />
    <line x1="0" y1="900" x2="10" y2="900" />
    <line x1="0" y1="950" x2="10" y2="950" />
    <line x1="0" y1="1000" x2="10" y2="1000" />
  </g>
  
  <!-- Numbers every 100px -->
  <g fill="#1E3A8A" font-family="monospace" font-size="6">
    <text x="2" y="105" transform="rotate(90, 5, 100)">100</text>
    <text x="2" y="205" transform="rotate(90, 5, 200)">200</text>
    <text x="2" y="305" transform="rotate(90, 5, 300)">300</text>
    <text x="2" y="405" transform="rotate(90, 5, 400)">400</text>
    <text x="2" y="505" transform="rotate(90, 5, 500)">500</text>
    <text x="2" y="605" transform="rotate(90, 5, 600)">600</text>
    <text x="2" y="705" transform="rotate(90, 5, 700)">700</text>
    <text x="2" y="805" transform="rotate(90, 5, 800)">800</text>
    <text x="2" y="905" transform="rotate(90, 5, 900)">900</text>
  </g>
</svg> 